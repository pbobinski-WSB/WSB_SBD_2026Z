version: '3.8'

services:
  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: demo-iceberg
    ports:
      - "8888:8888"   # Port dla interfejsu przeglądarki Jupyter Notebook
      - "8080:8080"   # Port dla Spark UI (podgląd zadań Sparka w przeglądarce)
    environment:
      - SPARK_HOME=/opt/spark
    volumes:
      # 1. Mapujemy lokalny folder 'notebooks' do Jupytera (Twój kod przetrwa restarty)
      - ./notebooks:/home/iceberg/notebooks/local_demo
      
      # 2. Mapujemy lokalny folder 'warehouse' jako fizyczny dysk dla naszej bazy Iceberg
      - ./warehouse:/home/iceberg/warehouse    
      - ./demo.py:/home/iceberg/demo.py
